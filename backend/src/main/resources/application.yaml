spring:
  application:
    name: somnilingua
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:appdb}
    username: ${POSTGRES_USER:appuser}
    password: ${POSTGRES_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: somnilingua
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    schemas: somnilingua
    default-schema: somnilingua
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    table: flyway_schema_history

server:
  port: ${PORT:8080}
logging:
  level:
    org.flywaydb: DEBUG
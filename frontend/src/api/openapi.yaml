openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8082
  description: Generated server url
tags:
- name: Language
  description: Api to manage languages
- name: CEFR Controller
  description: Operations related to CEFR levels
paths:
  /api/enrollments:
    get:
      tags:
      - enrollment-controller
      summary: Get paginated list of user's enrollments
      description: Returns a paginated and filtered list of languages for a user.
      operationId: getPaginatedLanguageEnrollments
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseLanguageEnrollmentResponse"
    post:
      tags:
      - enrollment-controller
      summary: Enroll user into a language
      description: Creates a LanguageEnrollment record linking a user and a language.
      operationId: createEnrollment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnrollmentRequest"
        required: true
      responses:
        "204":
          description: Enrollment created successfully
        "404":
          description: User or Language not found
        "409":
          description: User already enrolled in language
  /api/languages:
    get:
      tags:
      - Language
      summary: List of all languages
      description: It returns a list of all the available languages
      operationId: getLanguages
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LanguageResponse"
  /api/cefrs:
    get:
      tags:
      - CEFR Controller
      summary: Get all CEFR levels
      description: Returns a list of all CEFR entries available in the system
      operationId: getAllCefrs
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CefrResponse"
components:
  schemas:
    CreateEnrollmentRequest:
      type: object
      properties:
        languageId:
          type: integer
          format: int64
        starterMinutes:
          type: integer
          format: int32
        dailyGoalMinutes:
          type: integer
          format: int32
          minimum: 1
      required:
      - dailyGoalMinutes
      - languageId
      - starterMinutes
    LanguageResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Internal id
          example: 1
        name:
          type: string
          description: Display name
          example: Spanish
        code:
          type: string
          description: Language code
          example: es
          maxLength: 10
      required:
      - code
      - id
      - name
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    ActivityStatsResponse:
      type: object
      properties:
        todayMinutes:
          type: integer
          format: int64
        totalMinutes:
          type: integer
          format: int64
      required:
      - todayMinutes
      - totalMinutes
    CefrProgressResponse:
      type: object
      properties:
        currentLevel:
          type: string
        nextLevel:
          type: string
          nullable: true
        minutesUntilNextLevel:
          type: integer
          format: int64
        progressPercent:
          type: integer
          format: int32
      required:
      - currentLevel
      - minutesUntilNextLevel
      - progressPercent
    LanguageEnrollmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dailyGoalMinutes:
          type: integer
          format: int32
        activityStats:
          $ref: "#/components/schemas/ActivityStatsResponse"
        language:
          $ref: "#/components/schemas/LanguageResponse"
        cefrProgress:
          $ref: "#/components/schemas/CefrProgressResponse"
      required:
      - activityStats
      - cefrProgress
      - dailyGoalMinutes
      - id
      - language
    Meta:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      required:
      - page
      - size
      - totalElements
      - totalPages
    PageResponseLanguageEnrollmentResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LanguageEnrollmentResponse"
        meta:
          $ref: "#/components/schemas/Meta"
      required:
      - data
      - meta
    CefrResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        level:
          type: string
        minutes:
          type: integer
          format: int32
        hours:
          type: integer
          format: int32
        words:
          type: integer
          format: int32
        descriptionKey:
          type: string
        order:
          type: integer
          format: int32
      required:
      - descriptionKey
      - hours
      - id
      - level
      - minutes
      - order
      - words
